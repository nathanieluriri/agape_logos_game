# App launcher icon generation.
#
# Save the icon art (the glass-orb lotus mark) to assets/branding/app_icon.png
# as a square PNG (1024x1024 recommended), then run:
#
#   dart run flutter_launcher_icons
#
# This writes every Android mipmap density, the adaptive icon, and the web
# icons/favicon. app_icon.png is a transparent-backed RGBA lotus disc, so the
# adaptive background color shows through behind the whole mark. The background
# is teal-green (#0C7F80, AppColors.pond3), giving a lotus floating on the pond
# to match the in-app look. See assets/branding/README.md.
#
# PLAN (orchestrator, after regen): the non-adaptive mipmap-*/ic_launcher.png and
# web/icons/Icon-maskable-*.png are also built from this transparent source. A
# transparent legacy square icon, or a maskable with a transparent safe-zone, may
# want a filled background. Inspect both after regen (see plan 03 Task 7).
flutter_launcher_icons:
  image_path: "assets/branding/app_icon.png"
  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "#0C7F80"
  adaptive_icon_foreground: "assets/branding/app_icon.png"
  web:
    generate: true
    image_path: "assets/branding/app_icon.png"
    background_color: "#0C7F80"
    theme_color: "#0C7F80"
