  cryptography: ^2.7.0
  dio: ^5.9.2
  drift: ^2.34.0
  flutter_secure_storage: ^9.2.4
  firebase_auth: ^6.5.3
  firebase_core: ^4.11.0
  flame: ^1.35.1
  flame_audio: ^2.11.14
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_svg: ^2.0.10
  freezed_annotation: ^3.1.0
  go_router: ^17.2.3
  google_sign_in: ^7.2.0
  internet_connection_checker_plus: ^3.0.1
  json_annotation: ^4.12.0
  logging: ^1.3.0
  path: ^1.9.1
  path_drawing: ^1.0.1
  path_provider: ^2.1.5
  riverpod_annotation: ^4.0.3
  sqlite3: ^3.3.3
  sqlite3_flutter_libs: ^0.5.42
  uuid: ^4.5.3
  vibration: ^3.1.8
  workmanager: ^0.9.0+3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  build_runner: ^2.15.0
  drift_dev: ^2.34.0
  freezed: ^3.2.6-dev.1
  json_serializable: ^6.14.0
