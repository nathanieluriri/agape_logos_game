<svg viewBox="0 0 200 150" xmlns="http://www.w3.org/2000/svg">
  <!-- Seven-petal lotus mark. Petals are individual teardrops layered back to
       front (wings, dark inner pair, side pair, center), each with its own
       tip-to-base gradient so the flower reads with depth like the reference:
       light rims at the tips, deep rose sinking into the cup. -->
  <defs>
    <linearGradient id="gCenter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F2688B"/>
      <stop offset="0.55" stop-color="#E23A68"/>
      <stop offset="1" stop-color="#C92351"/>
    </linearGradient>
    <linearGradient id="gSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F58AA4"/>
      <stop offset="0.6" stop-color="#EE5C82"/>
      <stop offset="1" stop-color="#D93063"/>
    </linearGradient>
    <linearGradient id="gWing" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EF6E90"/>
      <stop offset="0.6" stop-color="#E04371"/>
      <stop offset="1" stop-color="#C22350"/>
    </linearGradient>
    <linearGradient id="gDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C22553"/>
      <stop offset="1" stop-color="#8F1538"/>
    </linearGradient>
  </defs>

  <!-- Outer wings: plump, swept low and wide. -->
  <path d="M100,58 C82,74 70,100 76,120 C81,133 90,138 100,138 C110,138 119,133 124,120 C130,100 118,74 100,58 Z"
        fill="url(#gWing)" transform="rotate(-50 100 132)"/>
  <path d="M100,58 C82,74 70,100 76,120 C81,133 90,138 100,138 C110,138 119,133 124,120 C130,100 118,74 100,58 Z"
        fill="url(#gWing)" transform="rotate(50 100 132)"/>

  <!-- Dark crimson pair peeking through the notches beside the center petal. -->
  <path d="M100,30 C90,52 81,92 85,116 C88,130 94,135 100,135 C106,135 112,130 115,116 C119,92 110,52 100,30 Z"
        fill="url(#gDark)" transform="rotate(-16 100 132)"/>
  <path d="M100,30 C90,52 81,92 85,116 C88,130 94,135 100,135 C106,135 112,130 115,116 C119,92 110,52 100,30 Z"
        fill="url(#gDark)" transform="rotate(16 100 132)"/>

  <!-- Side pair: lighter pink, leaning out from the center. -->
  <path d="M100,34 C85,58 72,94 78,116 C83,131 91,137 100,137 C109,137 117,131 122,116 C128,94 115,58 100,34 Z"
        fill="url(#gSide)" transform="rotate(-22 100 132)"/>
  <path d="M100,34 C85,58 72,94 78,116 C83,131 91,137 100,137 C109,137 117,131 122,116 C128,94 115,58 100,34 Z"
        fill="url(#gSide)" transform="rotate(22 100 132)"/>

  <!-- Center petal: tallest, in front. -->
  <path d="M100,12 C82,44 66,88 74,114 C80,131 89,138 100,138 C111,138 120,131 126,114 C134,88 118,44 100,12 Z"
        fill="url(#gCenter)"/>
</svg>
