<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>Video texture spike</title>
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
          "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/"
        }
      }
    </script>
    <style>
      body { margin: 0; background: #f7f4ec; }
      #root { position: relative; width: 1080px; height: 1350px; overflow: hidden; background: #f7f4ec; }
      /* The video must be a direct root child and must decode, so it is parked
         off-frame rather than display:none (a hidden element may not decode). */
      #screen-src { position: absolute; left: -2000px; top: 0; width: 720px; height: 1640px; }
      #three-layer { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="spike" data-start="0" data-width="1080" data-height="1350" data-duration="3">
      <video
        id="screen-src"
        class="clip"
        src="footage/demo.mp4"
        data-start="0"
        data-duration="3"
        data-track-index="0"
        muted
        playsinline
      ></video>
      <canvas id="three-layer" class="clip" data-start="0" data-duration="3" data-track-index="1"></canvas>
    </div>
    <script type="module">
      import * as THREE from "three";

      const canvas = document.getElementById("three-layer");
      const video = document.getElementById("screen-src");

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(1080, 1350, false);
      renderer.setPixelRatio(1);

      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(35, 1080 / 1350, 0.1, 100);
      camera.position.set(0, 0, 6);

      const texture = new THREE.VideoTexture(video);
      texture.colorSpace = THREE.SRGBColorSpace;

      const plane = new THREE.Mesh(
        new THREE.PlaneGeometry(2, 2 * (1640 / 720)),
        new THREE.MeshBasicMaterial({ map: texture }),
      );
      scene.add(plane);

      function renderAt(time) {
        plane.rotation.y = Math.sin(time * 0.8) * 0.5;
        // Force the texture to re-upload the current decoded frame.
        texture.needsUpdate = true;
        renderer.render(scene, camera);
      }

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>
  </body>
</html>
