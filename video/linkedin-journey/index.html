<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1350" />
    <title>Agape Logos - 30 days</title>
    <link rel="stylesheet" href="styles.css" />
    <!-- gsap 3.14.2 and three 0.181.2 are VENDORED under vendor/, not pulled from a
         CDN, and they have to be. `snapshot` and `check` navigate with a hard-coded
         10s domcontentloaded budget (not raised by --timeout: it is `timeout: 1e4` at
         the goto call site). Module scripts block DOMContentLoaded, so the CDN round
         trips for gsap plus the three module graph (three.module.js -> three.core.js,
         plus the two addons) were charging ~2.6s against that budget, on top of the
         ~5.9s the first render spends compiling the clearcoat/PMREM shaders on
         software GL. Measured DCL was 8.9s at best and the tools timed out. Served
         from disk it is ~6.3s, with headroom. It also makes the render deterministic
         and offline: the CLI's own timeout hint tells you to vendor for exactly this.
         The bundler inlines relative script[src] into one classic inline script, so
         gsap must stay a plain (non-module) file. The importmap is inline JSON, not a
         script[src], so the bundler leaves it alone and the bare "three" specifier
         still resolves. -->
    <script src="vendor/gsap.min.js"></script>
    <script type="importmap">
      {
        "imports": {
          "three": "./vendor/three.module.js",
          "three/addons/": "./vendor/addons/"
        }
      }
    </script>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1080"
      data-height="1350"
      data-duration="40"
    >
      <!-- Direct root child. HyperFrames owns its playback. Parked off-frame so it
           still decodes; Three.js samples it as a texture. Never wrap this. -->
      <video
        id="screen-src"
        class="clip"
        src="assets/screen.mp4"
        data-start="0"
        data-duration="40"
        data-track-index="0"
        muted
        playsinline
      ></video>

      <!-- Layer 0: paper ground + architecture planes (Task 5) -->
      <div id="bg-layer" class="clip layer" data-start="0" data-duration="40" data-track-index="1"></div>

      <!-- Layer 1: the device -->
      <canvas id="three-layer" class="clip layer" data-start="0" data-duration="40" data-track-index="2"></canvas>

      <!-- Layer 2: typography (Task 6) + break-out elements (Task 7) -->
      <div id="fg-layer" class="clip layer" data-start="0" data-duration="40" data-track-index="3"></div>
    </div>

    <!-- ==================================================================
         ALL COMPOSITION JS MUST LIVE INLINE.

         The HyperFrames producer strips every external <script src="..."> from
         the page before capture (verified against v0.7.55: the tags are absent
         from the rendered DOM) and it also blocks module fetches of local files,
         so `import "./scene.js"` never resolves. An external scene.js / timeline.js
         renders a dead frame with no error. The CDN gsap tag and the CDN importmap
         above are the exception: the producer serves those two URLs from its own
         bundle. This matches the HyperFrames three.js adapter docs, which put the
         whole scene in an inline module.

         Task 4: author the choreography in the TIMELINE block at the bottom of
         this file, against window.__hfScene (camera, device, renderAt).
         ================================================================== -->

    <!-- ============================ THE DEVICE ============================ -->
    <script type="module">
      import * as THREE from "three";
      import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";
      import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

      const W = 1080;
      const H = 1350;

      // Palette (shared with styles.css).
      const PAPER = 0xf7f4ec;
      const INK = 0x1a1c1a;
      const GOLD = 0xd9a441;
      const SAGE = 0x5b8a72;

      // Device proportions, from the footage: 720x1640 => 0.439 aspect.
      const SCREEN_W = 2.2;
      const SCREEN_H = SCREEN_W * (1640 / 720);
      const BEZEL = 0.07;
      const BODY_W = SCREEN_W + BEZEL * 2;
      const BODY_H = SCREEN_H + BEZEL * 2;
      const BODY_D = 0.22;
      const BODY_R = 0.16;

      const canvas = document.getElementById("three-layer");
      const video = document.getElementById("screen-src");

      const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
      renderer.setSize(W, H, false);
      renderer.setPixelRatio(1);
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.0;

      const scene = new THREE.Scene();

      // Procedural environment: gives the glass and the anodised body something to
      // reflect. Generated in-process, so nothing is fetched at render time.
      const pmrem = new THREE.PMREMGenerator(renderer);
      scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

      const camera = new THREE.PerspectiveCamera(32, W / H, 0.1, 100);
      camera.position.set(0, 0, 13.2);
      camera.lookAt(0, 0, 0);

      // ---------------------------------------------------------------- shadows
      // The paper is the DOM layer behind this canvas, so the "ground" is a plane
      // parallel to the device, not a floor. The device is lit from the upper left,
      // so its shadow falls down and to the right, onto that paper.
      const TEX_W = 256;
      const TEX_H = 512;

      // A rounded-box signed-distance field, evaluated per pixel. Canvas
      // `ctx.filter = blur(...)` is not dependable in the render browser (it came
      // back as a hard-edged card), so the falloff is computed rather than filtered.
      // Fully deterministic: no randomness, no timing.
      function rectFalloffTexture({ insetFrac, softFrac, radiusFrac }) {
        const c = document.createElement("canvas");
        c.width = TEX_W;
        c.height = TEX_H;
        const ctx = c.getContext("2d");
        const img = ctx.createImageData(TEX_W, TEX_H);
        const halfW = TEX_W / 2 - TEX_W * insetFrac;
        const halfH = TEX_H / 2 - TEX_W * insetFrac;
        const radius = TEX_W * radiusFrac;
        const soft = Math.max(TEX_W * softFrac, 0.5);
        for (let y = 0; y < TEX_H; y++) {
          for (let x = 0; x < TEX_W; x++) {
            const px = Math.abs(x + 0.5 - TEX_W / 2) - (halfW - radius);
            const py = Math.abs(y + 0.5 - TEX_H / 2) - (halfH - radius);
            const d =
              Math.hypot(Math.max(px, 0), Math.max(py, 0)) +
              Math.min(Math.max(px, py), 0) -
              radius;
            // Smoothstep across the edge: 1 well inside, 0 well outside.
            let t = 1 - (d + soft) / (2 * soft);
            t = Math.min(1, Math.max(0, t));
            const a = Math.round(255 * t * t * (3 - 2 * t));
            const i = (y * TEX_W + x) * 4;
            // Coverage goes in RGB (alphaMap samples the green channel) and in alpha.
            img.data[i] = a;
            img.data[i + 1] = a;
            img.data[i + 2] = a;
            img.data[i + 3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.NoColorSpace;
        return tex;
      }

      function shadowPlane({ scale, softFrac, radiusFrac, opacity, offset }) {
        // The solid core of the falloff is sized to the body, so the extra plane area
        // is pure penumbra.
        const insetFrac = (scale - 1) / (2 * scale);
        const mesh = new THREE.Mesh(
          new THREE.PlaneGeometry(BODY_W * scale, BODY_H * scale),
          new THREE.MeshBasicMaterial({
            color: INK,
            alphaMap: rectFalloffTexture({ insetFrac, softFrac, radiusFrac }),
            transparent: true,
            opacity,
            depthWrite: false,
            toneMapped: false,
          }),
        );
        mesh.position.set(offset[0], offset[1], offset[2]);
        mesh.renderOrder = -1;
        return mesh;
      }

      // Ambient occlusion: a wide, very soft pool that grounds the whole object.
      const shadowSoft = shadowPlane({
        scale: 1.6,
        softFrac: 0.13,
        radiusFrac: 0.14,
        opacity: 0.16,
        offset: [0.14, -0.2, -0.55],
      });
      // Contact shadow: tight and darker, right under the body, so the device reads
      // as sitting on the paper instead of floating in front of it.
      const shadowContact = shadowPlane({
        scale: 1.1,
        softFrac: 0.03,
        radiusFrac: 0.07,
        opacity: 0.4,
        offset: [0.05, -0.07, -0.25],
      });
      const shadowGroup = new THREE.Group();
      shadowGroup.add(shadowSoft, shadowContact);
      scene.add(shadowGroup);

      // ----------------------------------------------------------------- device
      const device = new THREE.Group();
      // Static base pose (not animation): a dead-on frontal shot hides the body's
      // side, so no rim light and no glass sheen can read. A few degrees of yaw and
      // pitch turn the lit right edge toward camera. Task 4 tweens from here.
      device.rotation.set(0.035, -0.16, 0.012);
      scene.add(device);

      // Body: deep cool graphite. The paper is warm and light, so a warm off-white
      // body dissolves into it; graphite separates and lets the teal screen read as
      // the light source in the frame.
      const body = new THREE.Mesh(
        new RoundedBoxGeometry(BODY_W, BODY_H, BODY_D, 6, BODY_R),
        new THREE.MeshPhysicalMaterial({
          color: 0x252b2a,
          roughness: 0.36,
          metalness: 0.72,
          clearcoat: 0.55,
          clearcoatRoughness: 0.18,
        }),
      );
      device.add(body);

      // Screen: the footage. Basic + toneMapped:false so the pond teal keeps its own
      // luminance and glows against the paper instead of being flattened by ACES.
      // The screen texture is a 2D-canvas mirror of the <video>, not a VideoTexture.
      // A WebGL upload straight from the element takes the last frame the compositor
      // PRESENTED, which in a headless seek-and-shoot lags the seek by one frame (the
      // t=37 shot came back showing the t=14 beat). drawImage takes the frame the
      // element has currently DECODED, which is the one the seek just landed on.
      const frameCanvas = document.createElement("canvas");
      frameCanvas.width = 720;
      frameCanvas.height = 1640;
      const frameCtx = frameCanvas.getContext("2d");
      const texture = new THREE.CanvasTexture(frameCanvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      const screen = new THREE.Mesh(
        new THREE.PlaneGeometry(SCREEN_W, SCREEN_H),
        new THREE.MeshBasicMaterial({
          map: texture,
          // Rounds the screen's corners into the body's radius, so the glass does not
          // read as a square sticker on a rounded slab.
          alphaMap: rectFalloffTexture({ insetFrac: 0.004, softFrac: 0.004, radiusFrac: 0.055 }),
          transparent: true,
          toneMapped: false,
        }),
      );
      screen.position.z = BODY_D / 2 + 0.002;
      device.add(screen);

      // Glass: a single specular sheen plane over the screen. Nearly transparent,
      // very smooth, so the environment leaves a soft diagonal highlight that moves
      // when the device turns.
      const glass = new THREE.Mesh(
        new THREE.PlaneGeometry(BODY_W, BODY_H),
        new THREE.MeshPhysicalMaterial({
          color: 0xffffff,
          transparent: true,
          opacity: 0.1,
          roughness: 0.06,
          metalness: 0.0,
          clearcoat: 1.0,
          clearcoatRoughness: 0.04,
          reflectivity: 0.75,
          depthWrite: false,
        }),
      );
      glass.position.z = BODY_D / 2 + 0.014;
      device.add(glass);

      // Specular streak: the soft diagonal window reflection that makes glass read as
      // glass instead of flat plastic. An additive band, painted once, deterministic.
      const streakCanvas = document.createElement("canvas");
      streakCanvas.width = 256;
      streakCanvas.height = 512;
      {
        const ctx = streakCanvas.getContext("2d");
        const g = ctx.createLinearGradient(0, 0, 256, 512);
        g.addColorStop(0.0, "rgba(255,255,255,0)");
        g.addColorStop(0.3, "rgba(255,255,255,0)");
        g.addColorStop(0.42, "rgba(255,255,255,0.55)");
        g.addColorStop(0.5, "rgba(255,255,255,0.16)");
        g.addColorStop(0.56, "rgba(255,255,255,0.42)");
        g.addColorStop(0.68, "rgba(255,255,255,0)");
        g.addColorStop(1.0, "rgba(255,255,255,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 256, 512);
        // Fade the streak out at the panel edges so it does not spill past the glass.
        const edge = ctx.createRadialGradient(128, 256, 40, 128, 256, 270);
        ctx.globalCompositeOperation = "destination-in";
        edge.addColorStop(0, "rgba(255,255,255,1)");
        edge.addColorStop(0.75, "rgba(255,255,255,0.75)");
        edge.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = edge;
        ctx.fillRect(0, 0, 256, 512);
      }
      const streakTex = new THREE.CanvasTexture(streakCanvas);
      streakTex.colorSpace = THREE.SRGBColorSpace;
      const streak = new THREE.Mesh(
        new THREE.PlaneGeometry(SCREEN_W * 1.02, SCREEN_H * 1.01),
        new THREE.MeshBasicMaterial({
          map: streakTex,
          transparent: true,
          opacity: 0.16,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          toneMapped: false,
        }),
      );
      streak.position.z = BODY_D / 2 + 0.016;
      device.add(streak);

      // Screen spill: the pond light bleeding onto the paper around the device.
      // Additive, sage, and wide, so the phone reads as lit from within.
      const spillCanvas = document.createElement("canvas");
      spillCanvas.width = 256;
      spillCanvas.height = 512;
      {
        const ctx = spillCanvas.getContext("2d");
        const g = ctx.createRadialGradient(128, 256, 20, 128, 256, 250);
        g.addColorStop(0, "rgba(255,255,255,0.85)");
        g.addColorStop(0.45, "rgba(255,255,255,0.28)");
        g.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 256, 512);
      }
      const spillTex = new THREE.CanvasTexture(spillCanvas);
      spillTex.colorSpace = THREE.SRGBColorSpace;
      const spill = new THREE.Mesh(
        new THREE.PlaneGeometry(BODY_W * 1.9, BODY_H * 1.25),
        new THREE.MeshBasicMaterial({
          color: SAGE,
          map: spillTex,
          transparent: true,
          opacity: 0.62,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          toneMapped: false,
        }),
      );
      spill.position.set(0, 0, -0.5);
      spill.renderOrder = -2;
      scene.add(spill);

      // --------------------------------------------------------------- lighting
      // Key: soft, from the upper left, the direction the shadow falls away from.
      const key = new THREE.DirectionalLight(0xfffaf0, 2.4);
      key.position.set(-5, 6, 7);
      scene.add(key);

      // Rim: warm gold, low and from the right and behind, so it catches the body's
      // right edge and the chamfer, and nothing else.
      const rim = new THREE.DirectionalLight(GOLD, 5.5);
      rim.position.set(7, 1.5, -1.2);
      scene.add(rim);

      // Bounce: the warm paper throwing light back up into the body.
      const bounce = new THREE.DirectionalLight(PAPER, 0.7);
      bounce.position.set(0, -5, 4);
      scene.add(bounce);

      scene.add(new THREE.AmbientLight(PAPER, 0.35));

      // ----------------------------------------------------------------- render
      let lastTime = 0;

      function renderAt(time) {
        // Task 4 owns every device and camera move on the GSAP timeline. This hook
        // stays inert; it exists so motion has one home.
        lastTime = time;

        // Keep the shadow and the spill glued under the device wherever Task 4 moves
        // it. Derived from the device transform, not animated here.
        shadowGroup.position.set(device.position.x, device.position.y, 0);
        spill.position.set(device.position.x, device.position.y, -0.5);

        if (video.readyState >= 2) {
          frameCtx.drawImage(video, 0, 0, frameCanvas.width, frameCanvas.height);
          texture.needsUpdate = true;
        }
        renderer.render(scene, camera);
      }

      // The producer seeks the <video> and dispatches hf-seek without waiting for the
      // new frame to be decoded, so a render done only on hf-seek uploads the PREVIOUS
      // frame (verified: the t=37 frame showed the t=14 beat). Re-render whenever the
      // element actually presents its new frame. Still deterministic: the frame is a
      // pure function of the seek time, this only decides when it is uploaded.
      function repaintCurrentFrame() {
        renderAt(lastTime);
      }
      video.addEventListener("seeked", repaintCurrentFrame);
      video.addEventListener("loadeddata", repaintCurrentFrame);
      if (typeof video.requestVideoFrameCallback === "function") {
        const onVideoFrame = () => {
          repaintCurrentFrame();
          video.requestVideoFrameCallback(onVideoFrame);
        };
        video.requestVideoFrameCallback(onVideoFrame);
      }
      // The runtime calls this right after it dispatches hf-seek.
      window.__hfThreeRender = repaintCurrentFrame;

      // Screen rect in CSS pixels within the 1080x1350 frame, for Task 7's break-out
      // elements. Projects the four screen corners so it stays correct under any
      // camera or device transform Task 4 applies.
      function deviceScreenWorldRect() {
        device.updateWorldMatrix(true, false);
        const v = new THREE.Vector3();
        const pts = [
          [-SCREEN_W / 2, SCREEN_H / 2],
          [SCREEN_W / 2, SCREEN_H / 2],
          [SCREEN_W / 2, -SCREEN_H / 2],
          [-SCREEN_W / 2, -SCREEN_H / 2],
        ].map(([x, y]) => {
          v.set(x, y, BODY_D / 2).applyMatrix4(device.matrixWorld).project(camera);
          return { x: (v.x * 0.5 + 0.5) * W, y: (-v.y * 0.5 + 0.5) * H };
        });
        const xs = pts.map((p) => p.x);
        const ys = pts.map((p) => p.y);
        const x = Math.min(...xs);
        const y = Math.min(...ys);
        return { x, y, w: Math.max(...xs) - x, h: Math.max(...ys) - y };
      }

      window.__hfScene = { scene, camera, device, renderer, renderAt, deviceScreenWorldRect };

      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      renderAt(window.__hfThreeTime || 0);
    </script>

    <!-- ============================ THE TIMELINE ==========================
         Every device and camera move for the 40s, on the one paused timeline.
         Tasks 5-8 ADD to this timeline; they never create their own.

         This is a module, not a classic script, and it has to be: the DEVICE block
         above is `type="module"`, so it is deferred to after parsing, while a classic
         inline script runs during parsing. A classic block here would read
         window.__hfScene before the scene exists and throw on the destructure.
         Modules execute in document order, after parsing and before DOMContentLoaded,
         so the scene is always up by the time this runs and __timelines is always
         registered before anything looks for it.
         =================================================================== -->
    <script type="module">
      const { camera, device, renderAt } = window.__hfScene;

      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({
        paused: true,
        // Three.js does not re-render on GSAP tweens by itself: every timeline update
        // must push the scene. This is the bridge between GSAP and the three adapter,
        // and without it the device is frozen at its base pose for all 40s.
        onUpdate: () => renderAt(tl.time()),
      });

      // Beat labels. Later tasks position everything against these, never raw numbers.
      tl.addLabel("coldOpen", 0)
        .addLabel("claim", 4)
        .addLabel("rewind", 8)
        .addLabel("pond", 12)
        .addLabel("word", 16)
        .addLabel("sync", 19)
        .addLabel("backend", 24)
        .addLabel("wall", 28)
        .addLabel("close", 34);

      // --- Device: a continuous, unhurried turn. Never static, never fast. ---
      //
      // Yaw stays NEGATIVE for the whole arc, and that is a lighting constraint, not
      // a taste one. The rim light sits out at (7, 1.5, -1.2): it grazes the body's
      // +X side face. Negative yaw swings that face toward the lens, which is what
      // puts the gold line down the right edge. Positive yaw hides it and shows the
      // opposite face instead, which is lit by the white key: the rim goes out and the
      // device reads as a flat grey slab. So the arc is authored as a change in the
      // MAGNITUDE of the turn (a deep three-quarter view relaxing toward square, and
      // back) rather than as a swing through zero. Pitch carries the direction change.
      //
      // Cold open: turned well away, catching the light, then easing toward the lens.
      tl.fromTo(
        device.rotation,
        { y: -0.42, x: 0.07 },
        { y: -0.26, x: 0.05, duration: 8, ease: "power2.out" },
        "coldOpen",
      );

      // Rewind: the device tips back and opens up, as if being turned back to the start.
      tl.to(device.rotation, { y: -0.09, x: -0.03, duration: 4, ease: "power2.inOut" }, "rewind");

      // The build: leans back into the turn as the architecture crowds in, then
      // progressively settles square to camera as the story accumulates.
      tl.to(device.rotation, { y: -0.24, x: 0.02, duration: 6, ease: "sine.inOut" }, "pond");
      tl.to(device.rotation, { y: -0.11, duration: 5, ease: "sine.inOut" }, "sync");
      tl.to(device.rotation, { y: -0.21, duration: 4, ease: "sine.inOut" }, "backend");

      // Close: settles square to the lens and comes to rest. A few degrees of yaw are
      // kept: dead-on at exactly 0 is what kills the rim and the glass sheen, so this
      // is as square as the device can be and still read as a lit object.
      tl.to(device.rotation, { y: -0.07, x: 0.025, duration: 6, ease: "power3.out" }, "wall");

      // Breathing drift, layered on top so the device is never dead. Finite repeats
      // only (repeat: -1 is banned: it makes the render non-deterministic). 5s each way,
      // 7 repeats: 8 half-cycles, exactly the 40s, and it lands at rest on the last frame.
      tl.to(
        device.position,
        { y: 0.07, duration: 5, ease: "sine.inOut", yoyo: true, repeat: 7 },
        0,
      );

      // --- Camera: one slow, continuous push. No cuts, no whips. ---
      //
      // Framed against the 32deg lens and the 5.15-unit body: at z=13.4 the device is
      // about two thirds of the frame height, at z=11.6 about three quarters. Closer
      // than ~9 and the body is taller than the frame.
      tl.fromTo(
        camera.position,
        { z: 13.4 },
        { z: 12.3, duration: 12, ease: "power2.out" },
        "coldOpen",
      );
      // The build pushes in a touch as the architecture crowds in around the device.
      tl.to(camera.position, { z: 11.6, duration: 12, ease: "sine.inOut" }, "pond");
      // The wall pulls back to make room for the numbers.
      tl.to(camera.position, { z: 12.7, duration: 6, ease: "power2.inOut" }, "wall");
      // The close settles.
      tl.to(camera.position, { z: 12.3, duration: 6, ease: "power3.out" }, "close");

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
